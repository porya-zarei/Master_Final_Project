[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adcs-rl"
version = "0.1.0"
description = "Fault-tolerant spacecraft attitude control research: Basilisk simulation, classical control, and residual reinforcement learning."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Pouria Zarei" },
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "PyYAML>=6.0",
]


[project.optional-dependencies]
# Training dependencies; install with: pip install -e ".[rl]"
rl = [
  "gymnasium>=1.0",
  "stable-baselines3>=2.5",
  "torch>=2.5",
]
# Basilisk is installed separately according to its platform/build instructions.
sim = []
# Development and test tools; install with: pip install -e ".[dev]"
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["adcs*"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"


[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
